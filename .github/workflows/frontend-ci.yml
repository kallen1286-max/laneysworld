name: Frontend Build

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'index.html'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'vite.config.ts'
      - 'postcss.config.mjs'
      - 'default_shadcn_theme.css'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'index.html'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'vite.config.ts'
      - 'postcss.config.mjs'
      - 'default_shadcn_theme.css'
      - '.github/workflows/frontend-ci.yml'

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    name: Vite Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # Version is read from "packageManager" in package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        id: install
        run: |
          echo "## Install" >> $GITHUB_STEP_SUMMARY
          if pnpm install --frozen-lockfile 2>&1 | tee /tmp/install.txt; then
            echo "install_passed=true" >> $GITHUB_OUTPUT
            echo "✅ Dependencies installed." >> $GITHUB_STEP_SUMMARY
          else
            echo "install_passed=false" >> $GITHUB_OUTPUT
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -100 /tmp/install.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
        continue-on-error: true

      - name: Build
        id: build
        if: steps.install.outputs.install_passed == 'true'
        run: |
          echo "## Vite Build" >> $GITHUB_STEP_SUMMARY
          if pnpm run build 2>&1 | tee /tmp/build.txt; then
            echo "build_passed=true" >> $GITHUB_OUTPUT
            echo "✅ Build succeeded." >> $GITHUB_STEP_SUMMARY
            if [ -d build ]; then
              SIZE=$(du -sh build | cut -f1)
              echo "📦 Output: \`build/\` ($SIZE)" >> $GITHUB_STEP_SUMMARY
            elif [ -d dist ]; then
              SIZE=$(du -sh dist | cut -f1)
              echo "📦 Output: \`dist/\` ($SIZE)" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "build_passed=false" >> $GITHUB_OUTPUT
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -200 /tmp/build.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
        continue-on-error: true

      - name: Skip build (install failed)
        id: build_skipped
        if: steps.install.outputs.install_passed != 'true'
        run: |
          echo "build_passed=false" >> $GITHUB_OUTPUT
          echo "" > /tmp/build.txt
        continue-on-error: true

      - name: Post PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const install = '${{ steps.install.outputs.install_passed }}' === 'true';
            const build = '${{ steps.build.outputs.build_passed }}' === 'true';
            const allPassed = install && build;

            const safeRead = (p) => {
              try { return fs.readFileSync(p, 'utf8').trim(); }
              catch (e) { return ''; }
            };

            const installOutput = safeRead('/tmp/install.txt');
            const buildOutput = safeRead('/tmp/build.txt');

            let body = allPassed
              ? `## ✅ Frontend Build Passed\n\n`
              : `## ❌ Frontend Build Failed\n\n`;

            body += `| Check | Status |\n|-------|--------|\n`;
            body += `| pnpm install | ${install ? '✅ Passed' : '❌ Failed'} |\n`;
            body += `| vite build | ${build ? '✅ Passed' : install ? '❌ Failed' : '⏭️ Skipped'} |\n\n`;

            const tail = (s, n = 60) => s.split('\n').slice(-n).join('\n');

            if (!install && installOutput) {
              body += `<details><summary>Install output (last 60 lines)</summary>\n\n\`\`\`\n${tail(installOutput)}\n\`\`\`\n</details>\n\n`;
            }
            if (install && !build && buildOutput) {
              body += `<details><summary>Build output (last 80 lines)</summary>\n\n\`\`\`\n${tail(buildOutput, 80)}\n\`\`\`\n</details>\n\n`;
            }

            body += `\n---\n*Delaney's World CI · Vite Frontend*`;

            const marker = '<!-- laneysworld-frontend-bot -->';
            body = marker + '\n' + body;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail if any check failed
        if: steps.install.outputs.install_passed != 'true' || steps.build.outputs.build_passed != 'true'
        run: |
          echo "One or more checks failed:"
          [ "${{ steps.install.outputs.install_passed }}" != "true" ] && echo "  - Install failed"
          [ "${{ steps.build.outputs.build_passed }}" != "true" ] && echo "  - Build failed"
          exit 1
