    <!-- Anti-FOUC: set theme before any CSS paints so dark mode never flashes -->
    <script>
      (function () {
        try {
          var isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (isDark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
